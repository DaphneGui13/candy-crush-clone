<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff9ccb"/><stop offset=".55" stop-color="#b68cff"/><stop offset="1" stop-color="#63b6ff"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="heart" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#ffc2cf"/><stop offset=".45" stop-color="#ff4d6d"/><stop offset="1" stop-color="#a8102f"/></radialGradient>
  <radialGradient id="star" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#fff6ae"/><stop offset=".5" stop-color="#ffd60a"/><stop offset="1" stop-color="#c79200"/></radialGradient>
  <radialGradient id="dia" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#c7e8ff"/><stop offset=".5" stop-color="#3fa9f5"/><stop offset="1" stop-color="#1a5fa0"/></radialGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#4b1a6b" flood-opacity=".35"/></filter>
</defs>
<rect width="512" height="512" rx="112" fill="url(#bg)"/>
<rect width="512" height="512" fill="url(#glow)" rx="112"/>
<g transform="translate(256 256) scale(0.9) translate(-256 -256)">
  <!-- sparkles -->
  <g fill="#fff" opacity=".9">
    <path d="M92 120 l9 24 24 9 -24 9 -9 24 -9 -24 -24 -9 24 -9z"/>
    <path d="M420 330 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z"/>
    <circle cx="150" cy="420" r="8"/><circle cx="386" cy="96" r="6"/>
  </g>
  <!-- diamond (blue) -->
  <g transform="translate(120 360) rotate(-14)" filter="url(#sh)">
    <path d="M0 -62 L56 0 L0 62 L-56 0Z" fill="url(#dia)" stroke="#1a5fa0" stroke-width="9" stroke-linejoin="round"/>
    <ellipse cx="-16" cy="-22" rx="16" ry="8" transform="rotate(-40 -16 -22)" fill="#fff" opacity=".6"/>
  </g>
  <!-- star (yellow) -->
  <g transform="translate(398 150) rotate(14)" filter="url(#sh)">
    <path d="M0 -70 L20 -24 L68 -22 L30 10 L42 58 L0 32 L-42 58 L-30 10 L-68 -22 L-20 -24Z" fill="url(#star)" stroke="#c79200" stroke-width="9" stroke-linejoin="round"/>
    <ellipse cx="-16" cy="-30" rx="14" ry="7" transform="rotate(-40 -16 -30)" fill="#fff" opacity=".65"/>
  </g>
  <!-- heart candy (hero) -->
  <g transform="translate(256 268)" filter="url(#sh)">
    <path d="M0 150 C-185 52 -150 -118 0 -62 C150 -118 185 52 0 150Z" fill="url(#heart)" stroke="#8f0e28" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="-70" cy="-48" rx="42" ry="20" transform="rotate(-38 -70 -48)" fill="#fff" opacity=".6"/>
    <circle cx="-20" cy="-82" r="9" fill="#fff" opacity=".55"/>
  </g>
</g>
</svg>